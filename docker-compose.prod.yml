# 生产环境 Docker Compose 配置示例
# 使用方法: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  backend:
    environment:
      # 生产环境建议使用环境变量而不是 .env 文件
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - TRUST_PROXY=true
    # 生产环境可以移除 .env 文件挂载，直接使用环境变量
    # volumes:
    #   - ./backend/.env:/app/.env:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
