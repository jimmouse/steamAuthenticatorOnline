services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam-auth-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3010}:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - TRUST_PROXY=true
      - IP_HEADER=x-forwarded-for
      - STEAM_SERVICE_URL=http://steam-service:3020
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_SECRET:-change-this-secret}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - steam-auth-network
    healthcheck:
      # Use IPv4 loopback to avoid Node resolving localhost -> ::1 (IPv6) and failing when server only listens on IPv4.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3010/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-auth-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - steam-auth-network
    healthcheck:
      # Avoid localhost -> ::1 (IPv6) resolution issues
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  steam-service:
    build:
      context: ./steam-service
      dockerfile: Dockerfile
    container_name: steam-service
    restart: unless-stopped
    ports:
      - "${STEAM_SERVICE_PORT:-3020}:3020"
    environment:
      - NODE_ENV=production
      - PORT=3020
      - API_SECRET=${STEAM_SERVICE_API_SECRET:-change-this-secret}
      - ALLOWED_ORIGINS=http://backend:3010,http://localhost:3010
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - steam-service-data:/app/data
    networks:
      - steam-auth-network
    healthcheck:
      # steam-service enforces x-api-key globally (including /health)
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.request('http://127.0.0.1:3020/health',{headers:{'x-api-key':process.env.API_SECRET||''}},(r)=>process.exit(r.statusCode===200?0:1)); req.on('error',()=>process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  steam-auth-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
  steam-service-data:
