version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: steam-auth-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3010}:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-this}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - IP_HEADER=${IP_HEADER:-x-forwarded-for}
      - STEAM_SERVICE_URL=http://steam-service:3020
      - STEAM_SERVICE_API_KEY=${STEAM_SERVICE_API_SECRET:-change-this-secret}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - steam-auth-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steam-auth-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - steam-auth-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  steam-service:
    build:
      context: ./steam-service
      dockerfile: Dockerfile
    container_name: steam-service
    restart: unless-stopped
    ports:
      - "${STEAM_SERVICE_PORT:-3020}:3020"
    environment:
      - NODE_ENV=production
      - PORT=3020
      - API_SECRET=${STEAM_SERVICE_API_SECRET:-change-this-secret}
      - ALLOWED_ORIGINS=http://backend:3010,http://localhost:3010
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - steam-service-data:/app/data
    networks:
      - steam-auth-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3020/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  steam-auth-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
  steam-service-data:
