name: PM2 Bundle

# 在 GitHub 上完成前端编译和依赖安装，打包成 tar.gz 发布到 Release (tag: pm2-latest)
# 低内存服务器只需下载解压，无需 npm install / 编译

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend production deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Install steam-service production deps
        working-directory: steam-service
        run: npm ci --omit=dev

      - name: Assemble bundle
        run: |
          set -e
          rm -rf bundle
          mkdir -p bundle/frontend
          cp -r backend bundle/backend
          cp -r steam-service bundle/steam-service
          cp -r frontend/build/. bundle/frontend/
          cp pm2/ecosystem.config.js pm2/install.sh pm2/nginx-steam-auth.conf bundle/
          rm -rf bundle/backend/data bundle/backend/.env bundle/backend/Dockerfile bundle/backend/.dockerignore
          rm -rf bundle/steam-service/data bundle/steam-service/.env bundle/steam-service/Dockerfile bundle/steam-service/.dockerignore
          chmod +x bundle/install.sh
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > bundle/VERSION
          tar -czf steam-auth-pm2-linux-x64.tar.gz -C bundle .
          ls -lh steam-auth-pm2-linux-x64.tar.gz

      - name: Move rolling tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f pm2-latest
          git push -f origin pm2-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pm2-latest
          name: PM2 bundle (latest main)
          body: |
            自动构建自 commit ${{ github.sha }}，适用于 Linux x86_64 + Node 18/20。

            一键安装 / 更新：
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/pm2-latest/install.sh | sudo bash
            ```
          prerelease: true
          files: |
            steam-auth-pm2-linux-x64.tar.gz
            pm2/install.sh
