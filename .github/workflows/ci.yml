name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Check for syntax errors
        working-directory: ./backend
        run: node -c src/server.js

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build
        working-directory: ./frontend
        run: npm run build

  lint-steam-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: steam-service/package-lock.json
      
      - name: Install dependencies
        working-directory: ./steam-service
        run: npm ci
      
      - name: Check for syntax errors
        working-directory: ./steam-service
        run: node -c src/server.js

  docker-build-test:
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, lint-steam-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: steam-auth-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: steam-auth-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build Steam Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./steam-service
          file: ./steam-service/Dockerfile
          push: false
          tags: steam-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
